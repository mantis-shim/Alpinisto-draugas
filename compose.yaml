# Dev environment: SvelteKit (Vite hot reload) + MongoDB.
# The local llama.cpp model is NOT here; it runs on the host (see LLAMA_URL in .env.example).
services:
  app:
    image: node:24-alpine
    working_dir: /app
    # ponytail: npm install on every start keeps container deps in sync with package.json, no image rebuilds
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules # Linux deps, kept separate from the Windows host's node_modules
    env_file:
      - path: .env
        required: false
    environment:
      MONGODB_URI: mongodb://mongo:27017/alpinisto-draugas
      USE_POLLING: "true" # file watch events don't cross the Windows bind mount
    extra_hosts:
      - "host.docker.internal:host-gateway" # reach llama-server on the host (Linux needs this, Docker Desktop has it built in)
    depends_on:
      - mongo

  mongo:
    image: mongo:8
    ports:
      - "27017:27017" # for MongoDB Compass from the host
    volumes:
      - mongo-data:/data/db

volumes:
  node_modules:
  mongo-data:
